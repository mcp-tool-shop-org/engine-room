<script>
/* ============================================================================
 * engine-room — engine.js
 * App state, the lifecycle state machine, timer-driven simulation, telemetry.
 * Every timer that stands in for a real side effect is tagged `SIDE EFFECT:`.
 * Replace SIM.* with a WebSocket event stream (see EVENT MAP in data.js).
 * ========================================================================== */

const STATE = {
  theme: 'dark',
  online: true,                 // executor connected? false => read-only browser
  selectedId: null,
  filters: { q: '', kind: null, verified: false, resolvable: false, commercial: false },
  instances: {},                // recipeId -> instance (see INSTANCE shape in data.js)
  modal: null,                  // { type, ... }
  draft: {},                    // recipeId -> { paramKey: value }
};

/* ---- icons (inline, no external assets) ---- */
const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  x:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>',
  dash:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg>',
  scale: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M7 8 3 14h8L7 8ZM17 8l-4 6h8l-4-6ZM4 21h16"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>',
  sun:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg>',
  moon:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>',
  plug:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5M9 7V2M15 7V2M7 7h10v3a5 5 0 0 1-10 0V7Z"/></svg>',
  reactor:'<svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="13" stroke="currentColor" stroke-width="1.6" opacity=".4"/><circle cx="16" cy="16" r="4" fill="currentColor"/><path d="M16 4v6M16 22v6M4 16h6M22 16h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M7 7l4.2 4.2M20.8 20.8 25 25M25 7l-4.2 4.2M11.2 20.8 7 25" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".6"/></svg>',
  empty: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 9h18M8 14h2"/></svg>',
};

const uid = () => '0x' + Math.floor(Math.random() * 0xffff).toString(16).toUpperCase().padStart(3, '0');
const recipeById = (id) => RECIPES.find(r => r.id === id);

/* draft config accessor (initialized lazily from recipe params) */
function draftFor(recipe) {
  if (!STATE.draft[recipe.id]) {
    const d = {};
    recipe.params.forEach(p => { d[p.key] = p.value; });
    STATE.draft[recipe.id] = d;
  }
  return STATE.draft[recipe.id];
}

/* ---- instance lifecycle helpers ---- */
function ensureInstance(recipe) {
  if (!STATE.instances[recipe.id]) {
    STATE.instances[recipe.id] = {
      recipeId: recipe.id, state: 'idle', phase: '', steps: [],
      telemetry: null, ledger: [], andon: null, lineage: null,
      pid: null, wallClock: 0, preflightOk: false, _timers: [],
    };
  }
  return STATE.instances[recipe.id];
}
function clearTimers(inst) { (inst._timers || []).forEach(clearTimeout); (inst._intervals || []).forEach(clearInterval); inst._timers = []; inst._intervals = []; }
function setTimer(inst, fn, ms) { const t = setTimeout(fn, ms); inst._timers.push(t); return t; }

/* states that mean "busy / mid-flight" (used for spinner + non-blocking display) */
const BUSY = new Set(['resolving','materializing','activating','producing','applying','bringing-up','measuring','tearing-down','rolling-back']);
const TERMINAL_GOOD = { 'launchable-server':'ready', 'batch-producer':'done', 'modifier':'applied', 'router-fleet':'ready' };

/* Fallback meta for a recipe_kind the panel has no handler for (a 5th kind the
 * knowledge base grows that this build predates). Every consumer reads
 * KIND_META through kindMeta() so an unknown kind renders a legible
 * "unsupported kind" pane instead of crashing on `km.label` / `km.verb`. */
const UNKNOWN_KIND_META = { label: 'unsupported', verb: 'Run', running: 'Stop', glyph: 'unknown', axisLabel: '—', unsupported: true };
function kindMeta(recipe) {
  const k = recipe && recipe.kind;
  return (k && KIND_META[k]) || UNKNOWN_KIND_META;
}
function isSupportedKind(recipe) { return !!(recipe && KIND_META[recipe.kind]); }

/* ============================================================================
 * PLANS — per recipe action, the ordered steps the simulation walks.
 * Each step: { label, cmd, dur, phase?, gate?, comp?, upstream?, progress? }
 *   gate    -> compensator id whose blastRadius gates this step (human gate)
 *   comp    -> compensator id pushed to the ledger when the step completes
 *   upstream-> index of recipe.upstreams to flip healthy (router-fleet)
 *   progress-> show a determinate progress bar for this step (producer)
 * ========================================================================== */
function preflightPlan(recipe) {
  const steps = [
    { label: 'Resolving recipe lock', cmd: 'er resolve --lock ' + recipe.id, dur: 650 },
    { label: 'Checking capability band', cmd: `er check --driver "${recipe.compat.driver}" --cuda ${recipe.compat.cuda}`, dur: 700 },
  ];
  if (recipe.defectFloor) {
    steps.push({ label: `Checking defect floor (${recipe.defectFloor.dep} ≥ ${recipe.defectFloor.min})`,
      cmd: `er check --floor ${recipe.defectFloor.dep}>=${recipe.defectFloor.min}`, dur: 700, check: 'defectFloor' });
  }
  steps.push({ label: 'Probing artifact resolvability', cmd: 'er resolve --probe-pins', dur: 850, check: 'resolvable' });
  return steps;
}

function runPlan(recipe) {
  switch (recipe.kind) {
    case 'launchable-server':
      if (recipe.id === 'vllm-wsl') return {
        phase: 'materializing', verbPhase: 'activating',
        steps: [
          { label: 'Ensuring WSL2 distro + Docker engine', cmd: 'wsl --update', dur: 1300, gate: 'wslupdate', comp: 'wslupdate' },
          { label: 'Pulling pinned vLLM image', cmd: 'docker pull vllm/vllm-openai@sha256:9f3c…awq', dur: 1500, comp: 'container' },
          { label: 'Starting vLLM server on :8000', cmd: 'docker run --gpus all -p 8000 …', dur: 1100, phase: 'activating' },
        ],
      };
      return {
        phase: 'materializing', verbPhase: 'activating',
        steps: [
          { label: 'Unpacking vendored release asset', cmd: 'unzip llama-b4123-win-cuda12.8.zip', dur: 1100 },
          { label: 'Installing per-instance PATH shim', cmd: 'er shim add ' + recipe.id, dur: 700, comp: 'shim' },
          { label: `Starting server on :${recipe.port}`, cmd: `llama-server --port ${recipe.port} --model …`, dur: 1000, phase: 'activating', comp: 'stop' },
        ],
      };
    case 'batch-producer': return {
      phase: 'materializing', verbPhase: 'producing',
      steps: [
        { label: 'Building importance matrix', cmd: 'imatrix --calib wikitext-2 --chunks 512', dur: 1400, comp: 'venv' },
        { label: 'Quantizing to ' + draftFor(recipe).quant, cmd: `llama-quantize --imatrix … ${draftFor(recipe).quant}`, dur: 1900, phase: 'producing', comp: 'artifact', progress: true },
        { label: 'Writing GGUF artifact', cmd: 'write ' + recipe.outputPath, dur: 800 },
      ],
    };
    case 'modifier': return {
      phase: 'materializing', verbPhase: 'applying',
      steps: [
        { label: 'Inheriting target environment', cmd: 'er modifier env --from ' + recipe.target, dur: 900 },
        { label: 'Patching SageAttention kernels', cmd: 'pip install sageattention-2.2.0-cp311-win.whl', dur: 1300, phase: 'applying', comp: 'unpatch' },
      ],
    };
    case 'router-fleet': return {
      phase: 'materializing', verbPhase: 'bringing-up',
      steps: [
        { label: `Starting proxy on :${recipe.port}`, cmd: `litellm --config route.yaml --port ${recipe.port}`, dur: 1000, phase: 'bringing-up', comp: 'proxy' },
        { label: 'Awaiting upstream: ' + recipe.upstreams[0].name + ' (order 1)', cmd: 'wait http://:8080/health', dur: 1500, upstream: 0 },
        { label: 'Awaiting upstream: ' + recipe.upstreams[1].name + ' (order 2)', cmd: 'wait http://:8000/health', dur: 1600, upstream: 1 },
      ],
    };
    // A recipe_kind this build has no plan for: return null so SIM.run halts
    // legibly instead of dereferencing `plan.phase` on undefined.
    default: return null;
  }
}

/* ============================================================================
 * SIM — the timer-driven simulation. Public methods map 1:1 to EVENT MAP events.
 * ========================================================================== */
const SIM = {
  preflight(recipe) {
    const inst = ensureInstance(recipe);
    if (BUSY.has(inst.state)) return;
    clearTimers(inst);
    inst.andon = null; inst.preflightOk = false; inst.lineage = inst.lineage || null;
    inst.state = 'resolving'; inst.phase = 'preflight';
    inst.steps = preflightPlan(recipe).map(s => ({ ...s, status: 'pending' }));
    render();
    // SIDE EFFECT: real preflight resolves the lockfile, probes capability vs the rig,
    // and HEAD-requests every pinned artifact. Here it's a timed walk over the plan.
    this._walk(recipe, inst, inst.steps, 0, () => {
      inst.preflightOk = true; inst.state = 'preflight';
      inst.phase = 'preflight passed — ready to ' + kindMeta(recipe).verb.toLowerCase();
      render();
    });
  },

  // primary action: launch | produce | apply | bringUp — all share the walker
  run(recipe) {
    const inst = ensureInstance(recipe);
    if (!inst.preflightOk || BUSY.has(inst.state)) return;
    clearTimers(inst);
    const plan = runPlan(recipe);
    // Unknown recipe_kind: no plan to walk. Don't crash — surface it.
    if (!plan) {
      inst.state = 'idle'; inst.phase = '';
      toast('Unsupported recipe kind "' + (recipe.kind || '?') + '" — this build has no plan for it.', 'warn');
      render();
      return;
    }
    inst.state = plan.phase; inst.andon = null;
    inst.steps = plan.steps.map(s => ({ ...s, status: 'pending' }));
    if (recipe.kind === 'router-fleet') {
      inst.telemetry = { upstreams: recipe.upstreams.map(u => ({ ...u, health: 'gray' })) };
    }
    render();
    this._walk(recipe, inst, inst.steps, 0, () => this._enterMeasure(recipe, inst));
  },

  // walk an array of steps with timers, honoring gates / checks / compensators
  _walk(recipe, inst, steps, i, done) {
    if (i >= steps.length) { done(); return; }
    const step = steps[i];

    // human gate: pause and require explicit approval naming the blast radius
    if (step.gate && !step._approved) {
      step.status = 'pending';
      const comp = recipe.compensators.find(c => c.id === step.gate);
      STATE.modal = { type: 'gate', recipeId: recipe.id, comp, onApprove: () => {
        step._approved = true; STATE.modal = null;
        toast('Approved by you — ' + comp.label.toLowerCase(), 'warn');
        this._walk(recipe, inst, steps, i, done);          // resume same step
      }, onCancel: () => {
        STATE.modal = null; inst.state = 'preflight';
        inst.phase = 'gate declined — back to preflight'; toast('Gate declined — no machine-global change made');
        render();
      }};
      render();
      return;
    }

    step.status = 'active';
    if (step.phase) inst.state = step.phase;
    inst.phase = step.label;
    render();

    // SIDE EFFECT (materializeProgress): a determinate step (e.g. quantize) streams
    // a 0..1 progress fraction. Here a timer simulates that stream so a long op reads
    // as alive-and-advancing; the real WS replaces this with progress events.
    if (step.progress) {
      step._progress = step._progress || 0;
      const tick = 200, ramp = Math.max(tick, step.dur);
      inst._intervals = inst._intervals || [];
      const pv = setInterval(() => {
        if (step.status !== 'active') { clearInterval(pv); return; }
        // approach but never reach 1 until the step actually completes
        step._progress = Math.min(0.96, step._progress + tick / ramp);
        render();
      }, tick);
      inst._intervals.push(pv);
      step._progressIv = pv;
    }

    // SIDE EFFECT: each step below is a real shell/recipe_step in the executor.
    setTimer(inst, () => {
      // resolvability ANDON (the unresolvable cu128 recipe)
      if (step.check === 'resolvable' && recipe.trust.resolvable === 'no' && !inst.lineage) {
        step.status = 'fail';
        return this.andonHalt(recipe, inst, {
          expected: 'it to install the pinned artifacts and continue',
          because: 'a pinned artifact no longer resolves',
          pin: recipe.trust.failingPin,
          recovery: { label: 'Re-resolve', event: 'reResolve' },
        });
      }
      // defect-floor ANDON (e.g. vLLM WDDM hang below wsl2 2.7.0) — generic over
      // whatever dep the recipe names, not hardcoded to WSL.
      if (step.check === 'defectFloor') {
        const floor = recipe.defectFloor;
        const { cur } = defectFloorField(recipe);
        if (cur != null && cmpVer(cur, floor.min) < 0) {
          step.status = 'fail';
          return this.andonHalt(recipe, inst, {
            expected: `it to launch on ${floor.dep} ${cur}`,
            because: floor.why,
            pin: `${floor.dep} ${cur}  <  required ${floor.min}`,
            recovery: { label: `Set ${floor.dep} ≥ ${floor.min} & retry`, event: 'fixFloor' },
          });
        }
      }
      step.status = 'ok';
      if (step._progressIv) { clearInterval(step._progressIv); inst._intervals = (inst._intervals || []).filter(x => x !== step._progressIv); step._progressIv = null; step._progress = 1; }
      if (step.comp) {
        const comp = recipe.compensators.find(c => c.id === step.comp);
        if (comp && !inst.ledger.some(l => l.id === comp.id)) inst.ledger.push({ ...comp, doneAt: Date.now() });
      }
      if (step.upstream != null && inst.telemetry?.upstreams) {
        inst.telemetry.upstreams[step.upstream].health = 'green';
      }
      render();
      this._walk(recipe, inst, steps, i + 1, done);
    }, step.dur);
  },

  _enterMeasure(recipe, inst) {
    inst.state = 'measuring'; inst.phase = 'measuring against baseline';
    if (recipe.kind === 'router-fleet') {
      // router readiness is upstream health, not a sampled axis
      inst.phase = 'all required upstreams healthy';
      setTimer(inst, () => { inst.state = 'ready'; inst.phase = 'router up — upstreams healthy'; toast('Router ready — all upstreams green'); render(); }, 700);
      render(); return;
    }
    if (recipe.kind === 'modifier') {
      inst.telemetry = { delta: recipe.deltas, measuredAt: draftFor(recipe).res };
      render();
      // SIDE EFFECT: A/B probe vs the unmodified target at the chosen resolution.
      setTimer(inst, () => this.goldenResult(recipe, inst, true), 1700);
      return;
    }
    if (recipe.kind === 'batch-producer') {
      inst.telemetry = { bpw: recipe.baselines[0]?.value ?? null, bpwCeil: 4.6, wall: inst.wallClock };
      inst.phase = 'golden gate: file-hash + perplexity';
      render();
      setTimer(inst, () => this.goldenResult(recipe, inst, true), 1300);
      return;
    }
    // launchable-server: live telemetry samples
    const baseline = activeBaseline(recipe);
    inst.telemetry = { axis: recipe.axis, baseline, value: baseline.value, history: [],
      vram: 0, vramCeiling: RIG.vramCeiling, temp: 48, power: 120, samples: 0 };
    render();
    // SIDE EFFECT: repeating baselineSample over the WS while state===measuring,
    // then a goldenResult terminates the probe.
    inst._intervals = inst._intervals || [];
    const targetVram = recipe.id === 'vllm-wsl' ? 28.4 : 21.8;
    const iv = setInterval(() => {
      const t = inst.telemetry; if (!t) return;
      t.samples++;
      const jitter = (Math.sin(t.samples / 2) * 0.04 + (Math.random() - 0.5) * 0.05);
      t.value = Math.round(baseline.value * (1.06 + jitter));
      t.history.push(t.value); if (t.history.length > 32) t.history.shift();
      t.vram = Math.min(targetVram, t.vram + targetVram / 6 + Math.random() * 0.3);
      t.temp = Math.min(recipe.id === 'vllm-wsl' ? 71 : 64, t.temp + 3 + Math.random() * 2);
      t.power = Math.min(recipe.id === 'vllm-wsl' ? 410 : 352, t.power + 40 + Math.random() * 10);
      render();
    }, 600);
    inst._intervals.push(iv);
    setTimer(inst, () => { clearInterval(iv); inst._intervals = inst._intervals.filter(x => x !== iv); this.goldenResult(recipe, inst, true); }, 4600);
  },

  goldenResult(recipe, inst, pass) {
    if (!pass) {
      return this.andonHalt(recipe, inst, {
        expected: 'the golden gate to pass',
        because: 'output fell outside the golden tolerance — no performance claim is made',
        pin: recipe.golden.desc, recovery: { label: 'Re-resolve', event: 'reResolve' },
      });
    }
    inst.state = TERMINAL_GOOD[recipe.kind];
    inst.pid = inst.pid || uid();
    if (recipe.kind === 'batch-producer') { inst.phase = 'artifact written + golden passed'; inst.fileHash = 'sha256:' + Math.random().toString(16).slice(2, 14); toast('Done — ' + recipe.outputPath.split('/').pop() + ' written'); }
    else if (recipe.kind === 'modifier') { inst.phase = 'overlay applied + delta measured'; toast('Applied — delta measured vs ' + recipe.target); }
    else { inst.phase = 'serving + baseline passed'; toast(recipe.name + ' is ready on :' + recipe.port); }
    render();
  },

  andonHalt(recipe, inst, andon) {
    clearTimers(inst);
    inst.state = 'halted'; inst.phase = 'HALTED'; inst.andon = andon;
    render();
    // a halt is never silent: focus the banner for screen-reader + keyboard users
    requestAnimationFrame(() => document.getElementById('andon-focus')?.focus());
  },

  // recovery: re-resolve a 404'd / stale pin -> new instance lineage -> re-run
  reResolve(recipe) {
    const inst = ensureInstance(recipe);
    inst.lineage = recipe.trust.resolveFix
      ? { from: recipe.trust.resolveFix.from, to: recipe.trust.resolveFix.to }
      : { from: 'stale lock', to: 're-resolved lock' };
    inst.andon = null; inst.preflightOk = false;
    toast('Re-resolving on a fresh channel…');
    // SIDE EFFECT: mint a NEW instance pinned to the working channel, then re-probe.
    this.preflight(recipe);
  },

  fixFloor(recipe) {
    const floor = recipe.defectFloor;
    if (!floor) { this.preflight(recipe); return; }
    let { key } = defectFloorField(recipe);
    // If no field drives the floor, write to the dep key so the retry clears it.
    if (!key) key = floor.dep;
    const target = defectFloorTargetVersion(recipe, key);
    draftFor(recipe)[key] = target;
    toast(`${floor.dep} set to ${target} — retrying preflight`, 'warn');
    this.preflight(recipe);
  },

  // ready->stale drift (cheap re-probe, not a full re-measure)
  driftDetected(recipe) {
    const inst = STATE.instances[recipe.id];
    if (!inst || inst.state !== 'ready') return;
    inst.state = 'stale';
    inst.phase = 'driver bumped 581 → 610.47 — outside compat band';
    inst.lineage = { from: 'R581 baseline', to: 'R610.47 (re-probe)' };
    render();
  },
  reProbe(recipe) {
    const inst = STATE.instances[recipe.id];
    if (!inst) return;
    inst.state = 'measuring'; inst.phase = 're-probing (cheap, 256-tok)';
    render();
    setTimer(inst, () => { inst.state = 'ready'; inst.phase = 'within 5% — baseline still valid'; inst.lineage = null; toast('Re-probe OK — perf within 5%'); render(); }, 1600);
  },

  // executor connection dropped: in-flight work can no longer be observed. Stop
  // every busy instance's timers (gauges must NOT keep streaming under a
  // read-only label) and move it to a 'disconnected' limbo with an honest notice.
  goOffline() {
    let stopped = 0;
    for (const inst of Object.values(STATE.instances)) {
      if (BUSY.has(inst.state)) {
        clearTimers(inst);
        inst._wasBusy = inst.state;          // remember what was running, for reconnect
        inst.state = 'disconnected';
        inst.phase = 'executor disconnected mid-flight — last reading frozen; outcome unknown';
        inst.preflightOk = false;
        stopped++;
      }
    }
    if (stopped) toast(`Executor disconnected — ${stopped} in-flight run${stopped > 1 ? 's' : ''} frozen (no gauges stream offline).`, 'warn');
  },
  // executor reconnected: a frozen instance can't silently resume — it must be
  // re-driven from a clean state. Reset disconnected instances to idle so the
  // user re-preflights (the executor may have changed underneath us).
  goOnline() {
    for (const inst of Object.values(STATE.instances)) {
      if (inst.state === 'disconnected') {
        clearTimers(inst);
        inst.state = 'idle'; inst.phase = ''; inst.telemetry = null; inst.steps = [];
        inst.preflightOk = false; inst._wasBusy = null;
      }
    }
  },

  // stop / teardown: run compensators newest-first
  beginTeardown(recipe) {
    const inst = STATE.instances[recipe.id];
    if (!inst) return;
    // identity-verified confirm for a server stop (names what's being stopped)
    if (recipe.kind === 'launchable-server' && inst.state === 'ready') {
      STATE.modal = { type: 'stop', recipeId: recipe.id, onConfirm: () => { STATE.modal = null; this._teardown(recipe, inst); } };
      render(); return;
    }
    this._teardown(recipe, inst);
  },
  _teardown(recipe, inst) {
    clearTimers(inst);
    inst.state = 'tearing-down'; inst.phase = 'running compensators (newest-first)';
    const order = [...inst.ledger].reverse();      // newest-first
    inst._teardownQueue = order; render();
    const step = (k) => {
      if (k >= order.length) {
        inst.ledger = []; inst.telemetry = null; inst.steps = []; inst.state = 'idle';
        inst.phase = ''; inst.preflightOk = false; inst.pid = null; inst.andon = null; inst.lineage = null;
        toast('Torn down — rig is clean'); render(); return;
      }
      inst._teardownAt = k; render();
      setTimer(inst, () => step(k + 1), 800);
    };
    setTimer(inst, () => step(0), 500);
  },

  // rollback from a halt: replay the ledger (same machinery, different banner)
  rollback(recipe) {
    const inst = STATE.instances[recipe.id];
    if (!inst || !inst.ledger.length) return;
    inst.state = 'rolling-back'; inst.phase = 'replaying compensators from the ledger'; inst.andon = null;
    const order = [...inst.ledger].reverse();
    inst._teardownQueue = order; render();
    const step = (k) => {
      if (k >= order.length) {
        inst.ledger = []; inst.telemetry = null; inst.steps = []; inst.state = 'idle';
        inst.phase = ''; inst.preflightOk = false; toast('Rolled back — ledger replayed clean'); render(); return;
      }
      inst._teardownAt = k; render();
      setTimer(inst, () => step(k + 1), 800);
    };
    setTimer(inst, () => step(0), 400);
  },
};

/* ---- small utils ---- */
function activeBaseline(recipe) {
  const d = draftFor(recipe);
  const list = recipe.baselines || [];
  // empty baselines is contract-valid (modifier/router) — fall back to a neutral
  // readout instead of crashing the live-telemetry gauges on `baseline.value`.
  // null-safe: a baseline may be model-INDEPENDENT (model===null/undefined) — the
  // data contract + the Python _select_baseline both permit NULL-model baselines,
  // so guard both sides of startsWith instead of throwing on b.model.
  return list.find(b => (b.model || '').startsWith(d.model || '')) || list[0]
    || { model: '—', value: 0, unit: recipe.axis === 'tok_s' ? 'tok/s' : '', bound: 'lower' };
}
function cmpVer(a, b) {
  const pa = String(a).split('.').map(Number), pb = String(b).split('.').map(Number);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const x = pa[i] || 0, y = pb[i] || 0; if (x !== y) return x < y ? -1 : 1;
  } return 0;
}

/* Generic resolver for the draft field a defect floor governs. The floor's
 * `dep` (e.g. "wsl2") may not equal the form's param key (e.g. "wsl"), so we
 * match by key, then by an open-tier param whose options/value are version
 * strings. Returns { key, cur } with key=null when no field drives the floor.
 * Used by BOTH the preflight check and fixFloor, so the recovery is templated
 * from defectFloor — never hardcoded to "wsl". */
function defectFloorField(recipe) {
  const floor = recipe.defectFloor;
  if (!floor) return { key: null, cur: undefined };
  const d = draftFor(recipe);
  const isVer = v => /^\d+(\.\d+)+$/.test(String(v ?? ''));
  // 1. exact draft key
  if (d[floor.dep] != null) return { key: floor.dep, cur: d[floor.dep] };
  // 2. a param whose key is a prefix/suffix of dep (wsl2 <-> wsl), versioned
  const params = recipe.params || [];
  const dep = String(floor.dep).toLowerCase();
  const related = params.find(p => {
    const k = String(p.key).toLowerCase();
    return (dep.startsWith(k) || k.startsWith(dep)) && (isVer(d[p.key]) || (p.options || []).some(isVer));
  });
  if (related) return { key: related.key, cur: d[related.key] };
  // 3. any open-tier versioned param (last resort)
  const verParam = params.find(p => !p.locked && (isVer(d[p.key]) || (p.options || []).some(isVer)));
  if (verParam) return { key: verParam.key, cur: d[verParam.key] };
  return { key: null, cur: undefined };
}
/* Smallest offered version that clears the floor (so fixFloor sets a real,
 * selectable value), else floor.min bumped to satisfy cmpVer. */
function defectFloorTargetVersion(recipe, key) {
  const floor = recipe.defectFloor;
  const param = (recipe.params || []).find(p => p.key === key);
  const opts = (param && param.options || []).filter(o => /^\d+(\.\d+)+$/.test(String(o)));
  const clearing = opts.filter(o => cmpVer(o, floor.min) >= 0).sort(cmpVer);
  if (clearing.length) return clearing[0];
  // no offered option clears it — synthesize min's next patch (2.7.0 -> 2.7.1)
  const parts = String(floor.min).split('.').map(Number);
  parts[parts.length - 1] = (parts[parts.length - 1] || 0) + 1;
  return parts.join('.');
}

/* constraint validation for the config form (changeParam guard)
 * Guards key off the ACTUAL field keys the form emits (model/port/ctx/flash/
 * conc/wsl/src/quant/calib/target/res) and live recipe/rig data — never a
 * phantom key the form never produces (that would fail-open). */
function validateDraft(recipe) {
  const d = draftFor(recipe);
  // hard constraint: a recipe pinned to a 12.x / cu12x toolchain conflicts with a
  // cuda-13 rig. Derive the cuda version from real data — the recipe's pinned
  // compat band vs the live RIG cuda — not a non-existent form field.
  const rigCuda = String(RIG.cuda || '');
  const pinnedCuda = String(recipe.compat && recipe.compat.cuda || '');
  if (/^13\./.test(rigCuda) && /(?:^|\D)12\.|cu12/i.test(pinnedCuda))
    return { ok: false, why: `CUDA ${rigCuda} (rig) conflicts with this recipe's pinned ${pinnedCuda} toolchain.` };
  // modifier conflict: conflictsWhen names the target's BACKEND that hard-crashes
  // the overlay (e.g. "target backend == fp16_cuda ..."). d.target is the 'Apply
  // to' field — a TARGET RECIPE ID, not a backend token — so comparing d.target to
  // the backend token can never match (dead guard). Resolve d.target to its recipe
  // and compare ITS backend field against the conflict token, so the guard fires
  // when the applied-to recipe's backend is the conflicting one.
  if (recipe.kind === 'modifier' && recipe.conflictsWhen) {
    const m = recipe.conflictsWhen.match(/==\s*([a-z0-9_]+)/i);
    const conflictTarget = m && m[1];
    const targetBackend = recipeById(d.target) && recipeById(d.target).backend;
    if (conflictTarget && targetBackend === conflictTarget)
      return { ok: false, why: `Conflicts: ${d.target}'s ${conflictTarget} backend hard-crashes with this overlay.` };
  }
  return { ok: true };
}

</script>
<script>
/* ============================================================================
 * engine-room — ui.js
 * Rendering + event wiring. render() is the single re-render entry point.
 * Interactions are realized via [data-act] delegation (see EVENT MAP in data.js).
 * ========================================================================== */

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
let booting = true;
let catalogError = false;   // set when the catalog GET fails (offline/read-only boot)

/* any filter narrowing the catalog right now? drives the empty-state copy:
 * "clear a filter" only makes sense when a filter is actually applied. */
function filtersActive() {
  const f = STATE.filters;
  return !!(f.q.trim() || f.kind || f.verified || f.resolvable || f.commercial);
}

/* ---------- badges ---------- */
function badge(cls, icon, label, tipTitle, tipMono) {
  const tip = tipTitle ? `<span class="tip"><span class="tip-k">${esc(tipTitle)}</span>${tipMono ? `<br><span class="mono">${esc(tipMono)}</span>` : ''}</span>` : '';
  return `<span class="badge ${cls}" tabindex="0" role="note" aria-label="${esc(label)}. ${esc(tipTitle || '')} ${esc(tipMono || '')}">${icon}<span>${esc(label)}</span>${tip}</span>`;
}
function trustBadges(r) {
  const t = r.trust; let h = '';
  h += t.verified
    ? badge('ok', ICON.check, 'verified', 'Claims grounded in a cited source', t.verifiedSource)
    : badge('gray', ICON.dash, 'unverified', 'No cited source backing the claims');
  h += t.resolvable === 'yes'
    ? badge('ok', ICON.check, 'resolvable', 'Pinned artifacts still install today')
    : t.resolvable === 'no'
      ? badge('bad', ICON.alert, "won't resolve", 'A pinned artifact no longer installs', t.failingPin)
      : badge('gray', ICON.dash, 'unchecked', 'Resolvability not yet probed');
  const cl = t.commercial === 'yes' ? 'ok' : t.commercial === 'conditional' ? 'warn' : 'bad';
  const lbl = t.commercial === 'yes' ? 'commercial' : t.commercial === 'conditional' ? 'conditional' : 'no commercial';
  h += badge(cl, ICON.scale, lbl, 'License', t.license);
  return h;
}

/* ---------- status pill ---------- */
function statusPill(inst) {
  if (!inst || inst.state === 'idle') return '';
  const busy = BUSY.has(inst.state);
  const label = inst.state.replace(/-/g, ' ');
  return `<span class="status-pill" data-s="${inst.state}" data-busy="${busy}"><span class="sdot"></span>${esc(label)}</span>`;
}

/* ---------- catalog ---------- */
function filtered() {
  const f = STATE.filters, q = f.q.trim().toLowerCase();
  return RECIPES.filter(r => {
    if (q && !(`${r.name} ${r.blurb} ${r.backend} ${r.kind}`.toLowerCase().includes(q))) return false;
    if (f.kind && r.kind !== f.kind) return false;
    if (f.verified && !r.trust.verified) return false;
    if (f.resolvable && r.trust.resolvable !== 'yes') return false;
    if (f.commercial && r.trust.commercial !== 'yes') return false;
    return true;
  });
}
function card(r, tabStopId) {
  const inst = STATE.instances[r.id];
  const running = inst && inst.state !== 'idle';
  const km = kindMeta(r);
  const base = r.baselines[0];
  const lastDelta = r.deltas && r.deltas[r.deltas.length - 1];
  const baseTxt = r.kind === 'modifier'
    ? (lastDelta ? `Δ +${lastDelta.pct}% @ ${lastDelta.at}` : 'no delta yet')
    : r.kind === 'router-fleet'
      ? `${(r.upstreams || []).length} upstreams`
      : base ? `${base.value} <b>${base.unit}</b>` : '';
  const selected = STATE.selectedId === r.id;
  // Roving tabindex: exactly ONE option is a tab stop (tabStopId — the selected
  // option, else the first VISIBLE card). Tab lands on the catalog once, then
  // arrows move selection + real focus. The listbox container is NOT a tab stop.
  const rovingTab = r.id === tabStopId ? '0' : '-1';
  return `<button class="card needs-exec-soft" role="option" aria-selected="${selected}" tabindex="${rovingTab}" data-running="${!!running}" data-act="select" data-id="${r.id}">
    <div class="card-top">
      <span class="kind-tag" data-kind="${r.kind}">${km.label}</span>
      <span class="card-name">${esc(r.name)}</span>
      ${statusPill(inst)}
    </div>
    <div class="card-blurb">${esc(r.blurb)}</div>
    <div class="badges">${trustBadges(r)}</div>
    <div class="card-foot">
      <span class="lane">${r.backend || 'inherits target'}</span>
      <span class="baseline-mini">${baseTxt}</span>
    </div>
  </button>`;
}
function renderCatalog() {
  const wrap = $('#catalog');
  // load FAILED: the catalog GET never arrived — show an error + Retry, never a
  // permanent skeleton. (realizes the brief's offline/read-only failure path)
  if (catalogError) {
    wrap.innerHTML = `<div class="empty-state empty-error" role="alert">${ICON.alert}
      <div style="font-weight:600;color:var(--ink)">Couldn't load the catalog</div>
      <div class="tiny">The recipe catalog request failed — the executor may be offline. Recipes, baselines, and trust signals all come from this GET.</div>
      <button class="btn btn-cyan mt12" data-act="retry-catalog">${ICON.plug} Retry</button></div>`;
    return;
  }
  if (booting) {
    wrap.innerHTML = Array.from({ length: 4 }).map(() =>
      `<div class="card" aria-hidden="true"><div class="skeleton" style="height:14px;width:60%"></div><div class="skeleton" style="height:12px;width:90%"></div><div class="skeleton" style="height:22px;width:50%"></div></div>`).join('');
    return;
  }
  const list = filtered();
  if (!list.length) {
    // distinguish "your filter hid everything" from "the catalog is genuinely empty"
    if (filtersActive()) {
      wrap.innerHTML = `<div class="empty-state">${ICON.empty}<div style="font-weight:600;color:var(--ink-dim)">No recipes match</div><div class="tiny">Clear a filter to widen the catalog.</div>
        <button class="btn btn-ghost mt12" data-act="clear-filters">Clear all filters</button></div>`;
    } else {
      wrap.innerHTML = `<div class="empty-state empty-error" role="alert">${ICON.alert}<div style="font-weight:600;color:var(--ink)">No recipes available</div>
        <div class="tiny">The catalog loaded but is empty — no recipes were returned. This is unusual; re-fetching may help.</div>
        <button class="btn btn-cyan mt12" data-act="retry-catalog">${ICON.plug} Retry</button></div>`;
    }
    return;
  }
  // the single roving tab stop: the selected option if it's visible, else the
  // first visible card. Guarantees exactly one tabindex=0 option in the listbox.
  const selectedVisible = list.some(r => r.id === STATE.selectedId);
  const tabStopId = selectedVisible ? STATE.selectedId : list[0].id;
  wrap.innerHTML = list.map(r => card(r, tabStopId)).join('');
}

/* ---------- gauges ---------- */
function sparkline(history, baselineV, breachLow) {
  if (!history.length) return '';
  const all = history.concat([baselineV]);
  const min = Math.min(...all) * 0.97, max = Math.max(...all) * 1.03, span = (max - min) || 1;
  const y = v => 44 - ((v - min) / span) * 40 + 2;
  const stepX = history.length > 1 ? 100 / (history.length - 1) : 0;
  const pts = history.map((v, i) => `${(i * stepX).toFixed(1)},${y(v).toFixed(1)}`);
  const last = history[history.length - 1];
  const breach = breachLow && last < baselineV;
  const area = `M0,46 L${pts.map(p => 'L' + p).join(' ').slice(1)} L100,46 Z`.replace('LL', 'L');
  return `<svg class="spark" viewBox="0 0 100 48" preserveAspectRatio="none" aria-hidden="true">
    <path class="fill" d="M0,46 ${pts.map(p => 'L' + p).join(' ')} L100,46 Z"/>
    <line class="base-line" x1="0" x2="100" y1="${y(baselineV).toFixed(1)}" y2="${y(baselineV).toFixed(1)}"/>
    <polyline class="trace ${breach ? 'breach' : ''}" points="${pts.join(' ')}"/>
  </svg>`;
}
function serverGauges(r, inst) {
  const t = inst.telemetry; if (!t) return '';
  const breachAxis = t.value < t.baseline.value;
  const vramPct = Math.min(100, (t.vram / t.vramCeiling) * 100);
  const vramBreach = t.vram > t.vramCeiling;
  const tickPct = 100; // ceiling tick at far right
  return `<div class="gauges">
    <div class="gauge ${breachAxis ? 'breach' : 'ok'}">
      <div class="gauge-h"><span class="gauge-k">${t.axis === 'tok_s' ? 'throughput' : t.axis}</span>
        <span class="tiny mono muted">baseline ≥ ${t.baseline.value} ${t.baseline.unit}</span></div>
      <div class="gauge-v mono">${t.value}<span class="unit">${t.baseline.unit}</span></div>
      ${sparkline(t.history, t.baseline.value, true)}
      <div class="gauge-sub"><span>${esc(t.baseline.model)}</span><span>${breachAxis ? 'BELOW baseline' : '+' + Math.round((t.value / t.baseline.value - 1) * 100) + '% vs bound'}</span></div>
    </div>
    <div class="gauge ${vramBreach ? 'breach' : 'ok'}">
      <div class="gauge-h"><span class="gauge-k">VRAM</span><span class="tiny mono muted">ceiling ${t.vramCeiling} GB</span></div>
      <div class="gauge-v mono">${t.vram.toFixed(1)}<span class="unit">/ ${t.vramCeiling} GB</span></div>
      <div class="meter" style="margin-top:14px"><div class="meter-fill ${vramBreach ? 'breach' : ''}" style="width:${vramPct}%"></div><div class="meter-tick" data-label="ceil" style="left:${tickPct}%"></div></div>
      <div class="gauge-sub"><span>temp ${Math.round(t.temp)}°C</span><span>${Math.round(t.power)} W</span></div>
    </div>
  </div>`;
}

/* ---------- steps ---------- */
function stepsList(inst) {
  if (!inst.steps.length) return '';
  return `<ul class="steps">${inst.steps.map(s => {
    // determinate progress for a progress:true step that is active (or completed)
    const showBar = s.progress && (s.status === 'active' || (s.status === 'ok' && s._progress != null));
    const pct = Math.round((s._progress || 0) * 100);
    const bar = showBar ? `<div class="step-progress"><div class="meter"><div class="meter-fill" style="width:${pct}%"></div></div><span class="step-pct mono">${pct}%</span></div>` : '';
    return `<li class="step" data-st="${s.status}">
    <span class="step-ico">${s.status === 'ok' ? ICON.check : s.status === 'fail' ? ICON.x : ''}</span>
    <span class="step-body"><div class="step-label">${esc(s.label)}</div><div class="step-cmd mono">${esc(s.cmd)}</div>${bar}</span>
  </li>`; }).join('')}</ul>`;
}

/* ---------- compensator ledger ---------- */
function ledgerRows(inst, teardown) {
  if (!inst.ledger.length) return `<div class="tiny muted">No destructive steps yet — nothing to undo.</div>`;
  const q = inst._teardownQueue;
  return `<div class="ledger">${inst.ledger.map((c, i) => {
    let running = '';
    if (teardown && q) {
      const idxInQ = q.findIndex(x => x.id === c.id);
      if (idxInQ < inst._teardownAt) running = 'done';
      else if (idxInQ === inst._teardownAt) running = 'active';
    }
    return `<div class="comp-row">
      <div class="comp-top"><span class="comp-label">${esc(c.label)}</span>${c.human_gated ? '<span class="comp-gate">human-gated</span>' : ''}
        ${running === 'active' ? '<span class="btn-spin spin" style="width:13px;height:13px;border-color:var(--cyan);border-right-color:transparent;margin-left:auto"></span>' : running === 'done' ? '<span style="margin-left:auto;color:var(--accent)">'+ICON.check.replace('24 24','24 24')+'</span>' : ''}</div>
      <div class="comp-cmd mono">$ ${esc(c.cmd)}</div>
      <div class="comp-post">post-state: <b>${esc(c.postState)}</b></div>
    </div>`;
  }).join('')}</div>`;
}

/* ---------- ANDON banner ---------- */
function andonBanner(r, inst) {
  if (!inst || !inst.andon) return '';
  const a = inst.andon;
  const canRollback = inst.ledger.length > 0;
  return `<div class="andon" role="alert" id="andon-focus" tabindex="-1">
    <div class="andon-top"><span class="andon-light"></span><span class="andon-title">${ICON.alert} Andon — line stopped</span></div>
    <div class="andon-contrast"><span class="exp">You expected ${esc(a.expected)} —</span> <span class="because">it halted because ${esc(a.because)}.</span>
      ${a.pin ? `<span class="pin mono">${esc(a.pin)}</span>` : ''}</div>
    <div class="andon-actions">
      <button class="btn btn-danger needs-exec" data-act="${a.recovery.event}" data-id="${r.id}">${esc(a.recovery.label)}</button>
      ${canRollback ? `<button class="btn btn-ghost needs-exec" data-act="rollback" data-id="${r.id}">Roll back ${inst.ledger.length} step${inst.ledger.length > 1 ? 's' : ''}</button>` : `<button class="btn btn-ghost" data-act="deselect">Dismiss</button>`}
    </div>
  </div>`;
}

/* ---------- config form ---------- */
function configForm(r) {
  const d = draftFor(r);
  return `<div class="form-grid">${r.params.map(p => {
    const locked = p.locked;
    const id = `f-${r.id}-${p.key}`;
    let control;
    if (p.options) {
      control = `<select id="${id}" data-act="param" data-id="${r.id}" data-key="${p.key}" ${locked ? 'disabled' : ''}>${p.options.map(o => `<option ${String(o) === String(d[p.key]) ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    } else {
      control = `<input id="${id}" value="${esc(d[p.key])}" data-act="param" data-id="${r.id}" data-key="${p.key}" ${locked ? 'readonly' : ''} ${typeof p.value === 'number' ? 'inputmode="numeric"' : ''}>`;
    }
    return `<div class="field" data-locked="${locked}">
      <label for="${id}">${esc(p.label)} ${locked ? '<span class="lock has-tip" tabindex="0">locked'+(p.help?`<span class="tip"><span class="tip-k">default-tier</span><br>${esc(p.help)}</span>`:'')+'</span>' : ''}</label>
      ${control}
    </div>`;
  }).join('')}</div>`;
}

/* ---------- polymorphic "instrument" section per kind ---------- */
function instrument(r, inst) {
  // Unknown recipe_kind: no instrument exists for it. Say so plainly instead of
  // rendering an empty section (the actionRow already disables the run button).
  if (kindMeta(r).unsupported) {
    return `<div class="section"><h3 class="section-h">Instrument</h3>
      <div class="panel-box"><div class="tiny muted">No instrument for kind <span class="mono">${esc(r.kind || '?')}</span>. This Control Panel build measures launchable-server, batch-producer, modifier, and router-fleet recipes. Newer kinds need a panel update before they can be run or read here.</div></div></div>`;
  }
  if (!inst) return '';
  const measuring = ['measuring'].includes(inst.state);
  const terminal = ['ready', 'done', 'applied', 'stale'].includes(inst.state);

  if (r.kind === 'router-fleet' && inst.telemetry?.upstreams) {
    const ups = inst.telemetry.upstreams;
    return `<div class="section"><h3 class="section-h">Fleet — per-upstream health</h3>
      <div class="panel-box"><table class="fleet"><thead><tr><th>Upstream</th><th>Order</th><th>Required</th><th>Health</th></tr></thead>
      <tbody>${ups.map(u => `<tr><td>${esc(u.name)}</td><td class="order">${u.order}</td><td class="req">${u.required ? 'required' : 'optional'}</td>
        <td><span class="health-dot ${u.health}"></span><span class="mono tiny">${u.health === 'green' ? 'healthy' : u.health === 'amber' ? 'starting' : 'down'}</span></td></tr>`).join('')}</tbody></table>
      <div class="tiny muted mt12">Router stays <b>not-ready</b> until every required upstream is green. Teardown is refcounted — it stops the front only.</div></div></div>`;
  }
  if (r.kind === 'modifier' && inst.telemetry?.delta) {
    return `<div class="section"><h3 class="section-h">Measured delta vs unmodified ${esc(r.target)}</h3>
      <div class="delta-wrap">${inst.telemetry.delta.map(dd => `<div class="delta-card"><div class="delta-res">@ ${esc(dd.at)}</div><div class="delta-val">+${dd.pct}%</div><div class="delta-bar"><span style="width:${Math.min(100, dd.pct * 3)}%"></span></div></div>`).join('')}</div>
      <div class="tiny muted mt12">No port, no server, no self-baseline — a modifier is judged purely by its delta against the base.</div></div>`;
  }
  if (r.kind === 'batch-producer' && (terminal || inst.telemetry?.bpw)) {
    const t = inst.telemetry || {};
    const wall = Math.round((inst.steps.reduce((a, s) => a + (s.dur || 0), 0)) / 1000 * 9.4);
    const written = inst.state === 'done';
    return `<div class="section"><h3 class="section-h">Producer output</h3>
      <div class="gauges" style="margin-bottom:14px">
        <div class="gauge ok"><div class="gauge-h"><span class="gauge-k">bits / weight</span><span class="tiny mono muted">target ≤ ${t.bpwCeil || 4.6}</span></div><div class="gauge-v mono">${(t.bpw ?? r.baselines[0]?.value ?? '—')}<span class="unit">bpw</span></div><div class="meter mt12"><div class="meter-fill" style="width:${((t.bpw||4.52)/(t.bpwCeil||4.6))*100}%"></div><div class="meter-tick" data-label="ceil" style="left:100%"></div></div></div>
        <div class="gauge"><div class="gauge-h"><span class="gauge-k">build wall-clock</span></div><div class="gauge-v mono">${wall}<span class="unit">s</span></div><div class="gauge-sub mt12"><span>golden: ${esc(r.golden.kind)}</span><span>${written ? 'PASS' : '—'}</span></div></div>
      </div>
      <div class="outfile ${written ? 'written' : ''}">${written ? ICON.check : ICON.dash}<span class="mono">${esc(r.outputPath)}</span>${written ? `<span class="hash mono">${esc(inst.fileHash || '')}</span>` : '<span class="hash">not written yet</span>'}</div>
    </div>`;
  }
  if (r.kind === 'launchable-server' && inst.telemetry && (measuring || inst.state === 'ready')) {
    return `<div class="section"><h3 class="section-h">Live telemetry — instrument readout</h3>${serverGauges(r, inst)}
      <div class="tiny muted mt12">Green = inside the bound, red = breached. Axis vs baseline and VRAM vs ceiling shown as colour <b>and</b> number.</div></div>`;
  }
  return '';
}

/* ---------- action row (polymorphic primary action) ---------- */
function actionRow(r, inst) {
  const km = kindMeta(r);
  const st = inst ? inst.state : 'idle';
  const busy = BUSY.has(st);
  const offline = !STATE.online;
  const terminalGood = st === TERMINAL_GOOD[r.kind];

  // A recipe_kind this build has no handler for: legible message, no dead button.
  if (km.unsupported) {
    return `<div class="action-row"><button class="btn" disabled>${esc(km.verb)}</button>
      <span class="action-hint err">${ICON.alert} Unsupported kind <span class="mono">${esc(r.kind || '?')}</span> — this Control Panel build has no plan for it. Update engine-room to run it.</span></div>`;
  }
  if (offline) {
    return `<div class="action-row"><button class="btn" disabled>${esc(km.verb)}</button>
      <span class="action-hint">${ICON.plug} Read-only — connect an executor to run. You can still browse, configure, and inspect.</span></div>`;
  }
  if (terminalGood || st === 'stale') {
    const driftBtn = (r.kind === 'launchable-server' && st === 'ready') ? `<button class="btn btn-ghost needs-exec" data-act="drift" data-id="${r.id}" title="simulate a driver bump">Simulate drift</button>` : '';
    const staleBtn = st === 'stale' ? `<button class="btn btn-warn needs-exec" data-act="reProbe" data-id="${r.id}">Re-probe (cheap)</button>` : '';
    return `<div class="action-row">
      ${staleBtn}
      <button class="btn btn-danger needs-exec" data-act="teardown" data-id="${r.id}">${esc(km.running)}</button>
      ${driftBtn}
      <span class="action-hint">${esc(stateHint(r, inst))}</span>
    </div>`;
  }
  if (busy) {
    return `<div class="action-row"><button class="btn btn-primary" disabled><span class="spin"></span>${esc(cap(st.replace(/-/g,' ')))}…</button>
      <span class="action-hint" aria-live="polite">${esc(inst.phase)}</span></div>`;
  }
  // idle or preflight-passed
  const pfOk = inst && inst.preflightOk;
  const val = validateDraft(r);
  const canRun = pfOk && val.ok;
  return `<div class="action-row">
    <button class="btn ${pfOk ? 'btn-ghost' : 'btn-cyan'} needs-exec" data-act="preflight" data-id="${r.id}">${pfOk ? 'Re-preflight' : 'Preflight'}</button>
    <button class="btn btn-primary needs-exec" data-act="run" data-id="${r.id}" ${canRun ? '' : 'disabled'}>${esc(km.verb)}${r.kind === 'modifier' ? ' to ' + esc(draftFor(r).target) : r.port ? ' :' + draftFor(r).port : ''}</button>
    <span class="action-hint ${!val.ok ? 'err' : ''}">${!val.ok ? ICON.alert + ' ' + esc(val.why) : pfOk ? 'Preflight passed — clear to ' + km.verb.toLowerCase() + '.' : 'Run preflight to resolve the lock and probe artifacts before any long work.'}</span>
  </div>`;
}
// Surgically refresh ONLY the polymorphic action row (validity + run button +
// hint) in place, so a free-text param input the user is mid-keystroke in is
// never destroyed — keeps native focus + caret. Used by the changeParam handler.
function updateActionRow(r, inst) {
  const old = $('#detail .action-row');
  if (!old) return false;
  const tmp = document.createElement('template');
  tmp.innerHTML = actionRow(r, inst).trim();
  const next = tmp.content.firstElementChild;
  if (next) { old.replaceWith(next); return true; }
  return false;
}
function stateHint(r, inst) {
  if (inst.state === 'ready') return r.kind === 'router-fleet' ? 'Router up — all required upstreams healthy.' : 'Serving on :' + r.port + ' (pid ' + inst.pid + ') — baseline passed.';
  if (inst.state === 'done') return 'Artifact written + golden passed.';
  if (inst.state === 'applied') return 'Overlay applied to ' + r.target + ' — delta measured.';
  if (inst.state === 'stale') return inst.phase;
  return '';
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

/* ---------- detail pane ---------- */
function renderDetail(animate) {
  const col = $('#detail');
  const r = recipeById(STATE.selectedId);
  if (!r) {
    col.innerHTML = `<div class="detail-empty">${ICON.reactor}<div style="font-weight:600;font-size:15px;color:var(--ink-dim)">Select a recipe</div><div class="tiny mt8">Pick an engine recipe from the catalog to see what it is, what it will do, and how to stand it up on your rig.</div></div>`;
    return;
  }
  const inst = STATE.instances[r.id];
  const km = kindMeta(r);
  const contradiction = r.trust.verified && r.trust.resolvable === 'no';
  const teardownActive = inst && (inst.state === 'tearing-down' || inst.state === 'rolling-back');

  col.innerHTML = `<div class="detail ${animate ? 'anim' : ''}">
    <div class="detail-scroll">
      <div class="dh-top">
        <div style="flex:1">
          <div class="row"><span class="kind-tag" data-kind="${r.kind}">${km.label}</span> ${statusPill(inst)}</div>
          <div class="dh-title mt8">${esc(r.name)}</div>
          <div class="dh-sub">${esc(r.blurb)}</div>
        </div>
      </div>
      <div class="dh-badges">${trustBadges(r)}</div>
      ${contradiction ? `<div class="lineage" style="background:var(--andon-dim);border-color:var(--andon);color:var(--ink)">${ICON.alert}<span>Verified <b>but won't resolve</b> — the claim is sound; the pinned artifact is gone. Re-resolve to use it.</span></div>` : ''}
      ${inst && inst.state === 'disconnected' ? `<div class="conn-lost" role="status">${ICON.plug}<span><b>Connection lost.</b> The executor disconnected while this was ${esc((inst._wasBusy || 'running').replace(/-/g,' '))}. The last reading is frozen — no gauges stream offline, and the run's outcome can't be confirmed. Reconnect the executor to start clean.</span></div>` : ''}
      ${inst && inst.lineage ? `<div class="lineage">${ICON.check}<span>${esc(inst.lineage.from)}</span><span class="arrow">→</span><span>${esc(inst.lineage.to)}</span></div>` : ''}

      <div class="section"><h3 class="section-h">What this will do</h3>
        <ul class="willdo">${r.willDo.map((w, i) => `<li><span class="n">${i + 1}</span><span>${esc(w)}</span></li>`).join('')}</ul></div>

      <div class="section"><h3 class="section-h">Baseline &amp; compatibility</h3>
        <div class="panel-box">
          ${r.baselines.length ? `<dl class="kv">${r.baselines.map(b => `<dt>${esc(b.model)}</dt><dd>${b.value} ${b.unit} <span class="muted">· ${b.bound}-bound${b.note ? ' ' + esc(b.note) : ''}</span></dd>`).join('')}</dl>` : `<div class="tiny muted">${r.kind === 'modifier' ? 'No self-baseline — measured purely as a delta vs the target.' : 'Readiness is upstream health, not a sampled axis.'}</div>`}
          <dl class="kv mt12"><dt>compat band</dt><dd>driver ${esc(r.compat.driver)} · cuda ${esc(r.compat.cuda)} · ${esc(r.compat.sm)}</dd>
          <dt>golden gate</dt><dd>${esc(r.golden.kind)} — <span class="muted">${esc(r.golden.desc)}</span></dd>
          ${r.conflictsWhen ? `<dt>conflicts</dt><dd style="color:var(--warn)">${esc(r.conflictsWhen)}</dd>` : ''}
          ${r.defectFloor ? `<dt>defect floor</dt><dd style="color:var(--warn)">${esc(r.defectFloor.dep)} ≥ ${esc(r.defectFloor.min)}</dd>` : ''}</dl>
        </div></div>

      <div class="section"><h3 class="section-h">Configure</h3>${configForm(r)}</div>

      ${actionRow(r, inst)}

      ${inst && inst.steps.length ? `<div class="section"><h3 class="section-h">${cap((inst.phase && BUSY.has(inst.state)) ? inst.state.replace(/-/g,' ') : 'Progress')}</h3><div class="panel-box">${stepsList(inst)}</div></div>` : ''}

      ${andonBanner(r, inst)}

      ${instrument(r, inst)}

      <div class="section"><h3 class="section-h">${teardownActive ? cap(inst.state.replace(/-/g,' ')) + ' — newest first' : 'Compensators — named undo + honest post-state'}</h3>
        <div class="panel-box">${inst ? ledgerRows(inst, teardownActive) : `<div class="ledger">${r.compensators.map(c => `<div class="comp-row"><div class="comp-top"><span class="comp-label">${esc(c.label)}</span>${c.human_gated ? '<span class="comp-gate">human-gated</span>' : ''}</div><div class="comp-cmd mono">$ ${esc(c.cmd)}</div><div class="comp-post">post-state: <b>${esc(c.postState)}</b></div></div>`).join('')}</div>`}</div></div>

      <div class="section"><h3 class="section-h">Pinned artifacts</h3><div class="panel-box"><dl class="kv">${r.pins.map(p => `<dt>${esc(p.label)}</dt><dd>${esc(p.ref)} <span class="muted">${p.vendored ? '· vendored' : '· ⚠ not vendored'}</span></dd>`).join('')}</dl></div></div>
    </div>
  </div>`;
}

/* ---------- topbar / banner ---------- */
function renderChrome() {
  $('#app').dataset.online = STATE.online;
  document.documentElement.dataset.theme = STATE.theme;
  $('#theme-ico').innerHTML = STATE.theme === 'dark' ? ICON.sun : ICON.moon;
  const ex = $('#exec'); ex.dataset.online = STATE.online;
  ex.querySelector('.exec-label').textContent = STATE.online ? 'Executor connected' : 'Offline — read-only';
  $('#readonly-banner').hidden = STATE.online;
  // filter chip states
  document.querySelectorAll('[data-filter-kind]').forEach(c => c.setAttribute('aria-pressed', STATE.filters.kind === c.dataset.filterKind));
  ['verified','resolvable','commercial'].forEach(k => { const c = $(`[data-filter-flag="${k}"]`); if (c) c.setAttribute('aria-pressed', STATE.filters[k]); });
}

/* ---------- modal ---------- */
function renderModal() {
  const host = $('#modal-host');
  const m = STATE.modal;
  if (!m) { host.innerHTML = ''; return; }
  let inner = '';
  if (m.type === 'gate') {
    const c = m.comp;
    inner = `<div class="modal modal-gate" role="alertdialog" aria-labelledby="m-h" aria-describedby="m-d">
      <div class="modal-h" id="m-h"><span class="warn-ico">${ICON.alert}</span> Human gate required</div>
      <p id="m-d" class="muted mt8" style="font-size:13.5px">This step can’t be scoped to engine-room alone. Approve the blast radius before it runs.</p>
      <div class="blast"><span class="blast-k">Blast radius</span>${esc(c.blastRadius)}</div>
      <div class="comp-row"><div class="comp-top"><span class="comp-label">${esc(c.label)}</span><span class="comp-gate">human-gated</span></div><div class="comp-cmd mono">$ ${esc(c.cmd)}</div><div class="comp-post">undo post-state: <b>${esc(c.postState)}</b></div></div>
      <div class="modal-actions"><button class="btn btn-ghost" data-act="gate-cancel">Cancel</button><button class="btn btn-warn" data-act="gate-approve" autofocus>Approve — I own this</button></div>
    </div>`;
  } else if (m.type === 'stop') {
    const r = recipeById(m.recipeId); const inst = STATE.instances[m.recipeId];
    inner = `<div class="modal modal-danger" role="alertdialog" aria-labelledby="m-h" aria-describedby="m-d">
      <div class="modal-h" id="m-h"><span class="danger-ico">${ICON.alert}</span> Stop ${esc(r.name)}?</div>
      <p id="m-d" class="muted mt8" style="font-size:13.5px">Identity-verified so you don’t stop the wrong thing:</p>
      <div class="comp-row"><div class="comp-cmd mono">$ er stop --pid ${inst.pid} --port ${r.port}</div><div class="comp-post"><b>Stops engine-room’s server on :${r.port} (pid ${inst.pid})</b> — not any other ${esc(r.name.split(' ')[0])} you’re running.</div></div>
      <p class="tiny muted">Then compensators run newest-first: per-instance shim removed, PATH restored (your global PATH was never touched).</p>
      <div class="modal-actions"><button class="btn btn-ghost" data-act="stop-cancel">Keep running</button><button class="btn btn-danger" data-act="stop-confirm" autofocus>Stop &amp; tear down</button></div>
    </div>`;
  }
  host.innerHTML = `<div class="modal-scrim" data-act="scrim">${inner}</div>`;
  const f = host.querySelector('[autofocus]'); if (f) f.focus();
}

/* ---------- toasts ---------- */
let toastSeq = 0;
function toast(msg, kind) {
  const id = ++toastSeq;
  const host = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast' + (kind === 'warn' ? ' warn' : '');
  el.setAttribute('role', 'status');
  el.innerHTML = `<span class="tdot"></span><span>${esc(msg)}</span>`;
  host.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateY(8px)'; setTimeout(() => el.remove(), 250); }, 3200);
}

/* ---------- master render ---------- */
function render() {
  renderChrome();
  renderCatalog();
  renderDetail(false);
  renderModal();
}

/* ============================================================================
 * EVENT WIRING
 * ========================================================================== */
function selectRecipe(id) {
  STATE.selectedId = id;
  $('#main').classList.add('detail-open');
  renderChrome(); renderCatalog(); renderDetail(true);
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act, id = t.dataset.id, r = id && recipeById(id);
  switch (act) {
    case 'select': selectRecipe(id); break;
    case 'deselect': { const inst = STATE.instances[STATE.selectedId]; if (inst) inst.andon = null; renderDetail(false); break; }
    case 'preflight': SIM.preflight(r); break;
    case 'run': SIM.run(r); break;
    case 'reResolve': SIM.reResolve(r); break;
    case 'fixFloor': SIM.fixFloor(r); break;
    case 'rollback': SIM.rollback(r); break;
    case 'teardown': SIM.beginTeardown(r); break;
    case 'drift': SIM.driftDetected(r); break;
    case 'reProbe': SIM.reProbe(r); break;
    case 'gate-approve': STATE.modal && STATE.modal.onApprove(); break;
    case 'gate-cancel': STATE.modal && STATE.modal.onCancel(); break;
    case 'stop-confirm': STATE.modal && STATE.modal.onConfirm(); break;
    case 'stop-cancel': STATE.modal = null; renderModal(); break;
    case 'scrim': if (e.target === t) { if (STATE.modal?.onCancel) STATE.modal.onCancel(); else { STATE.modal = null; renderModal(); } } break;
    case 'toggle-theme': STATE.theme = STATE.theme === 'dark' ? 'light' : 'dark'; localStorage.setItem('er-theme', STATE.theme); renderChrome(); break;
    case 'toggle-exec':
      STATE.online = !STATE.online;
      // Going offline must HALT in-flight simulations (clear their timers/intervals)
      // so gauges stop streaming; going online clears the frozen 'disconnected' limbo.
      if (STATE.online) SIM.goOnline(); else SIM.goOffline();
      render();
      break;
    case 'filter-kind': STATE.filters.kind = STATE.filters.kind === t.dataset.filterKind ? null : t.dataset.filterKind; renderChrome(); renderCatalog(); break;
    case 'filter-flag': STATE.filters[t.dataset.filterFlag] = !STATE.filters[t.dataset.filterFlag]; renderChrome(); renderCatalog(); break;
    case 'clear-filters': STATE.filters = { q: '', kind: null, verified: false, resolvable: false, commercial: false }; { const sb = $('#search'); if (sb) sb.value = ''; } renderChrome(); renderCatalog(); break;
    case 'retry-catalog': loadCatalog(); break;
  }
});

// config inputs (changeParam)
document.addEventListener('input', (e) => {
  const t = e.target.closest('[data-act="param"]'); if (!t) return;
  const r = recipeById(t.dataset.id); const d = draftFor(r);
  d[t.dataset.key] = t.value;
  // re-validate + re-enable run WITHOUT destroying the input the user is typing in:
  // surgically swap only the action row instead of rebuilding col.innerHTML.
  const inst = STATE.instances[r.id];
  if (inst) inst.preflightOk = false;     // changing config invalidates preflight
  if (!updateActionRow(r, inst)) {
    // fallback: full re-render, then restore focus + caret like the SEARCH handler
    const key = t.dataset.key, selStart = t.selectionStart, selEnd = t.selectionEnd;
    renderDetail(false);
    const re = document.querySelector(`[data-act="param"][data-id="${r.id}"][data-key="${key}"]`);
    if (re) { re.focus(); try { re.setSelectionRange(selStart, selEnd); } catch (_) {} }
  }
});
document.addEventListener('input', (e) => {
  const s = e.target.closest('#search'); if (!s) return;
  STATE.filters.q = s.value; renderCatalog();
  // keep focus in the search box after re-render
  const ns = $('#search'); if (ns && ns !== s) { ns.focus(); ns.value = s.value; }
});

// keyboard: Esc closes modal; arrows move catalog selection
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && STATE.modal) { e.preventDefault(); if (STATE.modal.onCancel) STATE.modal.onCancel(); else { STATE.modal = null; renderModal(); } return; }
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && e.target.closest('#catalog')) {
    const list = filtered(); if (!list.length) return;
    e.preventDefault();
    let idx = list.findIndex(x => x.id === STATE.selectedId);
    idx = e.key === 'ArrowDown' ? Math.min(list.length - 1, idx + 1) : Math.max(0, idx - 1);
    selectRecipe(list[idx].id);
    requestAnimationFrame(() => $(`.card[data-id="${list[idx].id}"]`)?.focus());
  }
  // simple focus trap inside modal
  if (e.key === 'Tab' && STATE.modal) {
    const f = [...document.querySelectorAll('.modal button')]; if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

/* ---------- catalog load (simulated GET /recipes) ---------- */
// Faithful stand-in for the real catalog GET: resolves with the recipe list, or
// REJECTS so the UI exercises its failure path. Replace with a real fetch().
// Forced-failure hooks (for the failure path + the test harness):
//   • ?catalogFail=1  in the URL
//   • window.__ER_FORCE_CATALOG_FAIL === true
function fetchCatalog() {
  return new Promise((resolve, reject) => {
    const forced = (typeof window !== 'undefined') &&
      (window.__ER_FORCE_CATALOG_FAIL === true ||
       (window.location && /[?&]catalogFail=1\b/.test(window.location.search || '')));
    setTimeout(() => {
      if (forced) reject(new Error('catalog GET failed (forced)'));
      else resolve(RECIPES);
    }, 650);
  });
}
function loadCatalog() {
  booting = true; catalogError = false;
  renderCatalog();              // shows skeletons while booting
  return fetchCatalog().then(() => {
    booting = false; catalogError = false; renderCatalog();
  }).catch(() => {
    booting = false; catalogError = true; renderCatalog();
    toast('Catalog failed to load — running read-only with no recipes.', 'warn');
  });
}

/* ---------- boot ---------- */
function boot() {
  STATE.theme = localStorage.getItem('er-theme') || 'dark';
  renderChrome();
  renderDetail(false);
  loadCatalog();
}
if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
}

</script>
