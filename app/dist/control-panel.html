  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"en\" data-theme=\"dark\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>engine-room — Control Panel<\u002Ftitle>\n<style>\u002F* ============================================================================\n * engine-room Control Panel — styles\n * Instrument-panel visual language: navy ink, deep-blue gradient, monospace\n * readouts. Dark default, light toggle via [data-theme=\"light\"].\n * ========================================================================== *\u002F\n\n:root {\n  --font-ui: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif;\n  --font-mono: ui-monospace, \"SF Mono\", \"Cascadia Code\", \"JetBrains Mono\", \"Consolas\", \"Liberation Mono\", monospace;\n\n  \u002F* dark (default) *\u002F\n  --bg-0: #070e1a;\n  --bg-1: #0a1422;\n  --bg-grad: radial-gradient(1200px 700px at 78% -10%, #14304d 0%, rgba(20,48,77,0) 55%),\n             linear-gradient(180deg, #0b1626 0%, #070e1a 100%);\n  --panel: rgba(17, 30, 50, 0.72);\n  --panel-2: rgba(12, 22, 38, 0.8);\n  --panel-solid: #111e32;\n  --hair: rgba(150, 180, 220, 0.12);\n  --hair-strong: rgba(150, 180, 220, 0.22);\n  --ink: #e7eef7;\n  --ink-dim: #9fb2c9;\n  --ink-faint: #6c8099;\n  --accent: #34e0a1;      \u002F* GO \u002F healthy *\u002F\n  --accent-dim: rgba(52, 224, 161, 0.16);\n  --cyan: #4fc3f7;\n  --cyan-dim: rgba(79, 195, 247, 0.16);\n  --warn: #f5b544;        \u002F* gate \u002F caution *\u002F\n  --warn-dim: rgba(245, 181, 68, 0.16);\n  --andon: #ff5d5d;       \u002F* HALT only *\u002F\n  --andon-dim: rgba(255, 93, 93, 0.14);\n  --andon-glow: rgba(255, 93, 93, 0.4);\n  --shadow: 0 18px 50px -20px rgba(0, 0, 0, 0.7);\n  --radius: 12px;\n  --radius-sm: 8px;\n}\n\n[data-theme=\"light\"] {\n  --bg-0: #eef2f7;\n  --bg-1: #e6ecf3;\n  --bg-grad: radial-gradient(1100px 650px at 80% -12%, #d4e4f3 0%, rgba(212,228,243,0) 55%),\n             linear-gradient(180deg, #f3f6fa 0%, #e6ecf3 100%);\n  --panel: rgba(255, 255, 255, 0.86);\n  --panel-2: rgba(248, 251, 255, 0.92);\n  --panel-solid: #ffffff;\n  --hair: rgba(15, 27, 45, 0.12);\n  --hair-strong: rgba(15, 27, 45, 0.2);\n  --ink: #0f1b2d;\n  --ink-dim: #44586f;\n  --ink-faint: #7488a0;\n  --accent: #0f9d6c;\n  --accent-dim: rgba(15, 157, 108, 0.14);\n  --cyan: #1f7fb8;\n  --cyan-dim: rgba(31, 127, 184, 0.12);\n  --warn: #b9791a;\n  --warn-dim: rgba(185, 121, 26, 0.14);\n  --andon: #d83a3a;\n  --andon-dim: rgba(216, 58, 58, 0.1);\n  --andon-glow: rgba(216, 58, 58, 0.3);\n  --shadow: 0 16px 40px -22px rgba(15, 27, 45, 0.35);\n}\n\n* { box-sizing: border-box; }\nhtml, body { height: 100%; }\nbody {\n  margin: 0;\n  font-family: var(--font-ui);\n  color: var(--ink);\n  background: var(--bg-1);\n  background-image: var(--bg-grad);\n  -webkit-font-smoothing: antialiased;\n  font-size: 14px;\n  line-height: 1.45;\n}\n.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }\nbutton { font-family: inherit; cursor: pointer; }\n:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; border-radius: 4px; }\n[hidden] { display: none !important; }\n\n\u002F* ---------- App shell ---------- *\u002F\n.app { display: flex; flex-direction: column; height: 100vh; min-height: 0; }\n\n.topbar {\n  display: flex; align-items: center; gap: 18px;\n  padding: 12px 20px; border-bottom: 1px solid var(--hair);\n  background: var(--panel-2); border-bottom: 1px solid var(--hair);\n  flex: 0 0 auto;\n}\n.brand { display: flex; align-items: center; gap: 10px; }\n.brand-mark { width: 26px; height: 26px; flex: 0 0 auto; }\n.brand-name { font-weight: 600; font-size: 15px; letter-spacing: 0.01em; }\n.brand-name .dash { color: var(--accent); }\n\n.rig-strip {\n  display: flex; align-items: center; gap: 18px; margin-left: 14px;\n  padding-left: 18px; border-left: 1px solid var(--hair);\n  color: var(--ink-dim); font-size: 12px;\n}\n.rig-strip .rig-item { display: flex; flex-direction: column; line-height: 1.25; }\n.rig-strip .rig-k { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-faint); }\n.rig-strip .rig-v { color: var(--ink); }\n\n.top-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }\n.exec-toggle {\n  display: flex; align-items: center; gap: 8px; padding: 7px 12px;\n  border-radius: 999px; border: 1px solid var(--hair-strong);\n  background: var(--panel); color: var(--ink-dim); font-size: 12px;\n}\n.exec-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent);\n  box-shadow: 0 0 0 3px var(--accent-dim); }\n.exec-toggle[data-online=\"false\"] .exec-dot { background: var(--ink-faint); box-shadow: none; }\n.exec-toggle[data-online=\"false\"] { border-style: dashed; }\n\n.icon-btn {\n  width: 34px; height: 34px; display: grid; place-items: center;\n  border-radius: 9px; border: 1px solid var(--hair-strong);\n  background: var(--panel); color: var(--ink-dim);\n}\n.icon-btn:hover { color: var(--ink); border-color: var(--hair-strong); }\n\n\u002F* ---------- Read-only banner ---------- *\u002F\n.readonly-banner {\n  display: flex; align-items: center; gap: 10px;\n  padding: 8px 20px; font-size: 12.5px; color: var(--ink);\n  background: var(--warn-dim); border-bottom: 1px solid var(--hair);\n}\n.readonly-banner b { font-weight: 600; }\n.readonly-banner .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }\n\n\u002F* ---------- Main split ---------- *\u002F\n.main { display: grid; grid-template-columns: minmax(340px, 440px) minmax(0, 1fr); flex: 1 1 auto; min-height: 0; overflow: hidden; }\n@media (max-width: 760px) { .main { grid-template-columns: 1fr; } .detail-col { display: none; } .main.detail-open .catalog-col { display: none; } .main.detail-open .detail-col { display: flex; } }\n\n.catalog-col { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; border-right: 1px solid var(--hair); }\n.detail-col { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }\n\n\u002F* ---------- Filter bar ---------- *\u002F\n.filterbar { padding: 14px 18px 10px; border-bottom: 1px solid var(--hair); flex: 0 0 auto; }\n.search {\n  display: flex; align-items: center; gap: 8px; padding: 9px 12px;\n  border-radius: 10px; border: 1px solid var(--hair-strong); background: var(--panel-2);\n}\n.search input { flex: 1; background: none; border: none; color: var(--ink); font-size: 13px; outline: none; }\n.search input::placeholder { color: var(--ink-faint); }\n.filter-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }\n.chip {\n  font-size: 11.5px; padding: 5px 10px; border-radius: 999px;\n  border: 1px solid var(--hair-strong); background: transparent; color: var(--ink-dim);\n  display: inline-flex; align-items: center; gap: 5px;\n}\n.chip:hover { color: var(--ink); }\n.chip[aria-pressed=\"true\"] { background: var(--cyan-dim); border-color: var(--cyan); color: var(--ink); }\n.filter-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-faint);\n  align-self: center; margin-right: 2px; }\n\n\u002F* ---------- Catalog list ---------- *\u002F\n.catalog { overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; flex: 1 1 auto; min-height: 0; }\n.catalog::-webkit-scrollbar { width: 10px; }\n.catalog::-webkit-scrollbar-thumb { background: var(--hair-strong); border-radius: 8px; border: 3px solid transparent; background-clip: padding-box; }\n\n.card {\n  position: relative; text-align: left; width: 100%;\n  border: 1px solid var(--hair); border-radius: var(--radius);\n  background: var(--panel); padding: 14px; color: inherit;\n  display: flex; flex-direction: column; gap: 10px;\n  transition: border-color .15s, transform .12s, background .15s;\n}\n.card:hover { border-color: var(--hair-strong); transform: translateY(-1px); }\n.card[aria-selected=\"true\" ); background: var(--panel-2); color: var(--ink); outline: none;\n}\n.field input:focus, .field select:focus { border-color: var(--cyan); }\n.field[data-locked=\"true\"] input, .field[data-locked=\"true\"] select { color: var(--ink-faint); background: var(--bg-1); cursor: not-allowed; }\n.field-err { color: var(--andon); font-size: 11px; display: flex; gap: 5px; align-items: center; }\n\n\u002F* primary action row *\u002F\n.action-row { display: flex; align-items: center; gap: 10px; margin-top: 18px; flex-wrap: wrap; }\n.btn {\n  display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 10px;\n  font-size: 13.5px; font-weight: 600; border: 1px solid var(--hair-strong);\n  background: var(--panel); color: var(--ink); transition: filter .12s, opacity .12s;\n}\n.btn:hover { filter: brightness(1.08); }\n.btn:disabled { opacity: .45; cursor: not-allowed; }\n.btn-primary { background: var(--accent); color: #06241a; border-color: transparent; }\n[data-theme=\"light\"] .btn-primary { color: #fff; }\n.btn-cyan { background: var(--cyan); color: #04263b; border-color: transparent; }\n.btn-ghost { background: transparent; }\n.btn-danger { background: var(--andon); color: #2a0606; border-color: transparent; }\n[data-theme=\"light\"] .btn-danger { color: #fff; }\n.btn-warn { background: var(--warn); color: #2a1c02; border-color: transparent; }\n.btn .spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent;\n  border-radius: 50%; animation: rot .7s linear infinite; }\n@keyframes rot { to { transform: rotate(360deg); } }\n.action-hint { font-size: 12px; color: var(--ink-dim); }\n.action-hint.err { color: var(--andon); }\n\n\u002F* ---------- Steps \u002F phases ---------- *\u002F\n.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }\n.step { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--hair); }\n.step:last-child { x; justify-content: space-between; }\n.gauge.breach .gauge-v { color: var(--andon); }\n.gauge.ok .gauge-v { color: var(--accent); }\n\n\u002F* bar meter *\u002F\n.meter { position: relative; height: 9px; border-radius: 6px; background: var(--bg-1); overflow: hidden; border: 1px solid var(--hair); }\n.meter-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--accent); transition: width .5s ease, background .3s; }\n.meter-fill.breach { background: var(--andon); }\n.meter-tick { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: .55; }\n.meter-tick::after { content: attr(data-label); position: absolute; top: -15px; left: 50%; transform: translateX(-50%);\n  font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); white-space: nowrap; }\n\n\u002F* sparkline *\u002F\n.spark { width: 100%; height: 46px; display: block; margin-top: 4px; }\n.spark .base-line { stroke: var(--ink-faint); stroke-dasharray: 3 3; stroke-width: 1; opacity: .6; }\n.spark .trace { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }\n.spark .trace.breach { stroke: var(--andon); }\n.spark .fill { fill: var(--accent-dim); }\n\n\u002F* ---------- ANDON banner ---------- *\u002F\n.andon {\n  border: 1px solid var(--andon); border-radius: var(--radius);\n  background: var(--andon-dim); padding: 16px; margin-top: 20px;\n  box-shadow: 0 0 0 1px var(--andon-dim), 0 0 30px -8px var(--andon-glow);\n  animation: andonIn .25s ease;\n}\n@keyframes andonIn { from { opacity: 0; transform: translateY(-6px); } }\n.andon-top { display: flex; align-items: center; gap: 10px; }\n.andon-light { width: 14px; height: 14px; border-radius: 50%; background: var(--andon);\n  box-shadow: 0 0 0 4px var(--andon-glow); animation: lamp 1.1s ease-in-out infinite; flex: 0 0 auto; }\n@keyframes lamp { 50% { box-shadow: 0 0 0 8px transparent; } }\n.andon-title { font-weight: 700; font-size: 14px; color: var(--andon); text-transform: uppercase; letter-spacing: 0.04em; }\n.andon-contrast { margin: 12px 0; font-size: 14px; line-height: 1.5; }\n.andon-contrast .exp { color: var(--ink-dim); }\n.andon-contrast .because { color: var(--ink); font-weight: 600; }\n.andon-contrast .pin { font-family: var(--font-mono); font-size: 12.5px; color: var(--andon);\n  display: block; margin-top: 8px; padding: 8px 10px; background: var(--bg-1); border-radius: 8px; border: 1px solid var(--andon-dim); }\n.andon-actions { display: flex; gap: 10px; flex-wrap: wrap; }\n\n\u002F* lineage chip after re-resolve *\u002F\n.lineage { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11.5px;\n  padding: 5px 10px; border-radius: 8px; background: var(--cyan-dim); color: var(--ink); border: 1px solid var(--cyan); margin-top: 10px; }\n.lineage .arrow { color: var(--cyan); }\n\n\u002F* connection-lost notice — executor dropped mid-flight (distinct from an ANDON halt) *\u002F\n.conn-lost { display: flex; align-items: flex-start; gap: 10px; margin-top: 12px;\n  padding: 11px 14px; border-radius: 10px; font-size: 12.5px; line-height: 1.5; color: var(--ink);\n  background: var(--warn-dim); border: 1px solid var(--warn); }\n.conn-lost svg { width: 16px; height: 16px; flex: 0 0 auto; margin-top: 1px; color: var(--warn); }\n.conn-lost b { font-weight: 600; }\n\n\u002F* ---------- Modifier delta gauge ---------- *\u002F\n.delta-wrap { display: flex; gap: 14px; flex-wrap: wrap; }\n.delta-card { flex: 1; min-width: 130px; border: 1px solid var(--hair); border-radius: var(--radius); padding: 14px; background: var(--panel-2); }\n.delta-res { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); }\n.delta-val { font-family: var(--font-mono); font-size: 30px; font-weight: 700; color: var(--accent); margin-top: 4px; }\n.delta-bar { height: 6px; border-radius: 6px; background: var(--bg-1); margin-top: 10px; overflow: hidden; }\n.delta-bar > span { display: block; height: 100%; background: var(--accent); border-radius: 6px; transition: width .6s ease; }\n\n\u002F* ---------- Router fleet table ---------- *\u002F\n.fleet { width: 100%; border-collapse: collapse; font-size: 13px; }\n.fleet th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em;\n  color: var(--ink-faint); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--hair); }\n.fleet td { padding: 10px 8px; border-bottom: 1px solid var(--hair); }\n.fleet tr:last-child td { border-bottom: none; }\n.health-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 8px; vertical-align: middle; }\n.health-dot.green { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }\n.health-dot.amber { background: var(--warn); animation: blink 1s steps(2) infinite; }\n.health-dot.gray  { background: var(--ink-faint); }\n.fleet .order { font-family: var(--font-mono); color: var(--ink-faint); }\n.fleet .req { font-size: 10px; color: var(--ink-faint); }\n\n\u002F* output path (producer) *\u002F\n.outfile { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 13px;\n  padding: 12px 14px; border-radius: 10px; border: 1px dashed var(--hair-strong); background: var(--panel-2); color: var(--ink-dim); }\n.outfile.written { border-style: solid; border-color: var(--accent); color: var(--ink); }\n.outfile .hash { color: var(--ink-faint); font-size: 11px; margin-left: auto; }\n\n\u002F* ---------- Compensator ledger ---------- *\u002F\n.ledger { display: flex; flex-direction: column; gap: 8px; }\n.comp-row { border: 1px solid var(--hair); border-radius: 10px; padding: 12px 14px; background: var(--panel-2); }\n.comp-top { display: flex; align-items: center; gap: 8px; }\n.comp-label { font-weight: 600; font-size: 13px; }\n.comp-gate { font-size: 10px; color: var(--warn); border: 1px solid var(--warn-dim); border-radius: 5px;\n  padding: 1px 6px; text-transform: uppercase; letter-spacing: 0.05em; }\n.comp-cmd { font-family: var(--font-mono); font-size: 11.5px; color: var(--cyan); margin-top: 6px; }\n.comp-post { font-size: 11.5px; color: var(--ink-dim); margin-top: 4px; }\n.comp-post b { color: var(--ink); }\n\n\u002F* ---------- Modal ---------- *\u002F\n.modal-scrim { position: fixed; inset: 0; background: rgba(4, 9, 18, 0.66); backdrop-filter: blur(3px);\n  display: grid; place-items: center; z-index: 100; animation: fade .15s ease; }\n@keyframes fade { from { opacity: 0; } }\n.modal {\n  width: min(520px, calc(100vw - 40px)); border-radius: 16px; background: var(--panel-solid);\n  border: 1px solid var(--hair-strong); box-shadow: var(--shadow); padding: 24px; animation: modalIn .2s ease;\n}\n@keyframes modalIn { from { opacity: 0; transform: translateY(10px) scale(.98); } }\n.modal-gate { border-top: 4px solid var(--warn); }\n.modal-danger { border-top: 4px solid var(--andon); }\n.modal-h { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600; }\n.modal-h .warn-ico { color: var(--warn); }\n.modal-h .danger-ico { color: var(--andon); }\n.blast {\n  margin: 16px 0; padding: 14px; border-radius: 10px; background: var(--warn-dim);\n  border: 1px solid var(--warn-dim); font-size: 13.5px; line-height: 1.5;\n}\n.blast .blast-k { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--warn); font-weight: 700; display: block; margin-bottom: 6px; }\n.modal .comp-row { margin: 14px 0; }\n.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }\n\n\u002F* ---------- Toast ---------- *\u002F\n.toasts { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 120;\n  display: flex; flex-direction: column; gap: 8px; align-items: center; }\n.toast { display: flex; align-items: center; gap: 9px; padding: 10px 16px; border-radius: 10px;\n  background: var(--panel-solid); border: 1px solid var(--hair-strong); box-shadow: var(--shadow);\n  font-size: 13px; animation: toastIn .2s ease; }\n.toast .tdot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }\n.toast.warn .tdot { background: var(--warn); }\n@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } }\n\n\u002F* read-only disables interactive run controls *\u002F\n.app[data-online=\"false\"] .needs-exec { opacity: .4; pointer-events: none; }\n\n\u002F* small util *\u002F\n.row { display: flex; align-items: center; gap: 10px; }\n.spread { justify-content: space-between; }\n.muted { color: var(--ink-dim); }\n.tiny { font-size: 11.5px; }\n.mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; }\n.kv { display: grid; grid-template-columns: auto 1fr; gap: 9px 16px; font-size: 12.5px; align-items: baseline; }\n.kv dt { color: var(--ink-faint); white-space: nowrap; } .kv dd { margin: 0; font-family: var(--font-mono); color: var(--ink); }\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }\n}\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n<div class=\"app\" id=\"app\" data-online=\"true\">\n\n  <!-- ============ Top bar ============ -->\n  <header class=\"topbar\">\n    <div class=\"brand\">\n      <span class=\"brand-mark\" id=\"brand-mark\"><\u002Fspan>\n      <span class=\"brand-name\">engine<span class=\"dash\">-<\u002Fspan>room<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"rig-strip\" aria-label=\"rig status\">\n      <div class=\"rig-item\"><span class=\"rig-k\">GPU<\u002Fspan><span class=\"rig-v mono\" id=\"rig-gpu\"><\u002Fspan><\u002Fdiv>\n      <div class=\"rig-item\"><span class=\"rig-k\">VRAM<\u002Fspan><span class=\"rig-v mono\" id=\"rig-vram\"><\u002Fspan><\u002Fdiv>\n      <div class=\"rig-item\"><span class=\"rig-k\">Driver<\u002Fspan><span class=\"rig-v mono\" id=\"rig-driver\"><\u002Fspan><\u002Fdiv>\n      <div class=\"rig-item\"><span class=\"rig-k\">CUDA<\u002Fspan><span class=\"rig-v mono\" id=\"rig-cuda\"><\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"top-actions\">\n      <button class=\"exec-toggle\" id=\"exec\" data-act=\"toggle-exec\" data-online=\"true\" aria-label=\"toggle executor connection\">\n        <span class=\"exec-dot\"><\u002Fspan><span class=\"exec-label\">Executor connected<\u002Fspan>\n      <\u002Fbutton>\n      <button class=\"icon-btn\" data-act=\"toggle-theme\" aria-label=\"toggle light\u002Fdark theme\"><span id=\"theme-ico\"><\u002Fspan><\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- ============ Read-only banner ============ -->\n  <div class=\"readonly-banner\" id=\"readonly-banner\" role=\"status\" hidden=\"\">\n    <span class=\"dot\"><\u002Fspan>\n    <span><b>Read-only.<\u002Fb> No executor is connected — this is your everyday “what can I run?” browser. Recipes, baselines, and trust signals are all visible; running is disabled until you connect.<\u002Fspan>\n  <\u002Fdiv>\n\n  <!-- ============ Main split ============ -->\n  <div class=\"main\" id=\"main\">\n    <!-- Catalog -->\n    <section class=\"catalog-col\" aria-label=\"recipe catalog\">\n      <div class=\"filterbar\">\n        <div class=\"search\">\n          <span id=\"search-ico\" style=\"color:var(--ink-faint);display:flex\"><\u002Fspan>\n          <input id=\"search\" type=\"search\" placeholder=\"Search recipes, backends, kinds…\" aria-label=\"search recipes\">\n        <\u002Fdiv>\n        <div class=\"filter-row\" role=\"group\" aria-label=\"filter by kind\">\n          <span class=\"filter-label\">kind<\u002Fspan>\n          <button class=\"chip\" data-act=\"filter-kind\" data-filter-kind=\"launchable-server\" aria-pressed=\"false\">server<\u002Fbutton>\n          <button class=\"chip\" data-act=\"filter-kind\" data-filter-kind=\"batch-producer\" aria-pressed=\"false\">producer<\u002Fbutton>\n          <button class=\"chip\" data-act=\"filter-kind\" data-filter-kind=\"modifier\" aria-pressed=\"false\">modifier<\u002Fbutton>\n          <button class=\"chip\" data-act=\"filter-kind\" data-filter-kind=\"router-fleet\" aria-pressed=\"false\">router<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"filter-row\" role=\"group\" aria-label=\"filter by trust\">\n          <span class=\"filter-label\">trust<\u002Fspan>\n          <button class=\"chip\" data-act=\"filter-flag\" data-filter-flag=\"verified\" aria-pressed=\"false\">verified<\u002Fbutton>\n          <button class=\"chip\" data-act=\"filter-flag\" data-filter-flag=\"resolvable\" aria-pressed=\"false\">resolvable<\u002Fbutton>\n          <button class=\"chip\" data-act=\"filter-flag\" data-filter-flag=\"commercial\" aria-pressed=\"false\">commercial<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"catalog\" id=\"catalog\" role=\"listbox\" aria-label=\"engine recipes\" tabindex=\"0\"><\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- Detail -->\n    <section class=\"detail-col\" id=\"detail\" aria-label=\"recipe detail\" aria-live=\"polite\"><\u002Fsection>\n  <\u002Fdiv>\n\n  <div id=\"modal-host\"><\u002Fdiv>\n  <div class=\"toasts\" id=\"toasts\" aria-live=\"polite\"><\u002Fdiv>\n<\u002Fdiv>\n\n<script src=\"68071b06-7091-4d2d-ba1d-85b5b1a348df\"><\u002Fscript>\n<script src=\"6154b8cc-e6e8-49d8-bf05-caa7ca96291a\"><\u002Fscript>\n<script src=\"65235490-5b21-4a39-a174-8d4af65384e5\"><\u002Fscript>\n<script>\n  \u002F\u002F hydrate static chrome that depends on RIG \u002F ICON (after scripts load)\n  document.getElementById('brand-mark').innerHTML = ICON.reactor.replace('fill=\"none\"', 'fill=\"none\" style=\"color:var(--accent)\"');\n  document.getElementById('search-ico').innerHTML = ICON.search;\n  document.getElementById('theme-ico').innerHTML = ICON.moon;\n  document.getElementById('rig-gpu').textContent = RIG.gpu;\n  document.getElementById('rig-vram').textContent = RIG.vramCeiling + ' GB';\n  document.getElementById('rig-driver').textContent = RIG.driver;\n  document.getElementById('rig-cuda').textContent = RIG.cuda + ' · ' + RIG.sm;\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
